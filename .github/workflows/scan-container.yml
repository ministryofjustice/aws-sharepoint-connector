---
name: Scan Container

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  scan-container:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
      security-events: write
    uses: ministryofjustice/analytical-platform-airflow-github-actions/.github/workflows/shared-scan-container.yml@28e3b3177bcc6739cfd50b2fb13716a52c457ffe # v9.0.0
    with:
      runtime: python
