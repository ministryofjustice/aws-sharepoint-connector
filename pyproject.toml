[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "aws-sharepoint-connector"
version = "1.2.0"
description = "Provides a connector via Graph API between AWS and SharePoint"
authors = [
    { name = "Philip Sinfield"},
    { name = "Guy Wheeler"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.24.0",
    "boto3>=1.40.8",
    "pydantic-settings>=2.11.0",
    "pydantic>=2.12.3",
    "requests>=2.32.4",
    "types-requests>=2.33.0.20260408",
]

[project.urls]
Repository = "https://github.com/ministryofjustice/aws-sharepoint-connector"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]
test = [
    "moto>=5.1.22",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0"
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.mypy]
strict = true
disallow_untyped_defs = true
exclude = "migrations|dist|build|typings"
explicit_package_bases = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.ruff.lint]
select = ["ALL"]
# Remove warnings
ignore = [
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "COM812", # Trailing comma missing
    "T201", # No print statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG", # some arguments are unused in tests functions but useful (e.g. mocks)
    "PLR2004", # hardcoded test data is OK for tests
    "S101", # asserts are OK for tests
    "SLF001" # accessing private members is OK for tests
]

[tool.lint.ruff.pydocstyle]
convention = "google"

[tool.lint.ruff.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.lint.bandit]
skips = [
    "B101", # assert used
]
